# Generated by GitHub Copilot Chat Assistant
name: Run md-extractor on proposals

on:
  pull_request:
    branches:
      - main

jobs:
  run-md-extractor:
    name: Build md-extractor (main) and run against proposals
    runs-on: macos-latest
    steps:
      - name: Checkout md-proposals
        uses: actions/checkout@v4

      - name: Get changed files (GitHub API, NUL-separated)
        id: list
        uses: actions/github-script@v6
        with:
        script: |
          const core = require('@actions/core');
          const fs = require('fs');
          const pr = context.payload.pull_request;
          if (!pr) {
            core.setFailed('This event does not appear to be a pull_request event.');
            return;
          }  

          const files = await github.paginate(
            github.rest.pulls.listFiles,
            {
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: pr.number,
            per_page: 100
            }
          );

          const names = files.map(f => f.filename);
          // write NUL-separated file for safe CLI consumption
          fs.writeFileSync('changed_files.nul', names.join('\0'), 'binary');
          // also write a human-readable newline file and print to log
          fs.writeFileSync('changed_files.txt', names.join('\n'), 'utf8');

          if (names.length === 0) {
            console.log('No changed files found.');
          } else {
            console.log(`${names.length} changed file(s):`);
            names.forEach(n => console.log(n));
          }

          // export NUL-separated list as base64 to preserve all bytes in outputs
          core.setOutput('files_b64', Buffer.from(names.join('\0'), 'binary').toString('base64'));
          core.setOutput('count', String(names.length));

      - name: Use changed files in bash and pass as args to a CLI tool
        env:
          FILES_B64: ${{ steps.list.outputs.files_b64 }}
        run: |
          # decode base64 back to NUL-separated file
          echo "$FILES_B64" | base64 --decode > changed_files.nul || true

          # read NUL-separated names into a bash array (safe for spaces/newlines)
          mapfile -d '' -t files < changed_files.nul

          echo "Files count: ${#files[@]}"
          printf '----- Changed files -----\n'
          for f in "${files[@]}"; do
            printf '%s\n' "$f"
          done
          printf '-------------------------\n'

      # Example: pass files as arguments to a CLI that accepts multiple file args
      # Replace `mytool` with your command; quoting the array preserves each filename
      # mytool "${files[@]}"

      # Alternative: If your tool accepts stdin with NUL-delimited filenames, use:
      # xargs -0 -a changed_files.nul -- mytool

      - name: Checkout dempseyatgithub/md-extractor (main)
        uses: actions/checkout@v4
        with:
          repository: dempseyatgithub/md-extractor
          ref: main
          path: md-extractor

      - name: Show Swift version
        run: swift --version

      - name: Build md-extractor (release)
        run: swift build -c release
        working-directory: md-extractor

      - name: Run md-extractor against proposals
        run: ${{ github.workspace }}/md-extractor/.build/release/md-extractor "${{ github.workspace }}/proposals"
