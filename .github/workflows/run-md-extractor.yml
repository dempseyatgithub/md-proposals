# Generated by GitHub Copilot Chat Assistant
name: Run md-extractor on proposals

on:
  pull_request:
    branches:
      - main

jobs:
  run-md-extractor:
    name: Build md-extractor (main) and run against proposals
    runs-on: macos-latest
    steps:
      - name: Checkout md-proposals
        uses: actions/checkout@v4

      - id: files
        uses: hanseltimeindustries/get-changed-files@v1

      - name: Checkout dempseyatgithub/md-extractor (main)
        uses: actions/checkout@v4
        with:
          repository: dempseyatgithub/md-extractor
          ref: main
          path: md-extractor

      - name: Show Swift version
        run: swift --version

      - name: Build md-extractor (release)
        run: swift build -c release
        working-directory: md-extractor

      - name: Run md-extractor against proposals
        run: ${{ github.workspace }}/md-extractor/.build/release/md-extractor --base-path ${{ github.workspace }} ${{ steps.files.outputs.all }}
