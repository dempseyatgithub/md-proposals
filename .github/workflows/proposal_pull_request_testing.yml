name: Validate proposals with swift-evolution-metadata-extractor

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - 'main'
    paths:
      - 'proposals/testing/*'

jobs:
  validate:
    name: Validate Proposals
    uses: dempseyatgithub/md-proposals/.github/workflows/proposal_validation.yml@main
    with:
      project: "testing"
